<dialog id="manage-dialog"><div class="form"><div class="formhead"><h2>קבועות וחובות</h2><button class="close" type="button" data-close aria-label="סגירה">×</button></div><div class="actions"><button class="primary" type="button" data-open-fixed>＋ הוצאה קבועה</button><button class="outline-button" type="button" data-open-debt>＋ הלוואה או חוב</button></div><div class="list" id="template-list" style="margin-top:12px"></div></div></dialog>
<dialog id="fixed-dialog"><form class="form" id="fixed-form"><div class="formhead"><h2>הוצאה קבועה</h2><button class="close" type="button" data-close aria-label="סגירה">×</button></div><div class="field"><label>שם התשלום</label><input name="name" maxlength="80" placeholder="למשל: חשמל, שכירות, מנוי" required /></div><div class="form-grid"><div class="field"><label>סכום חודשי</label><input name="amount" type="number" min="0.01" step="0.01" required /></div><div class="field"><label>יום בחודש</label><input name="dueDay" type="number" min="1" max="31" value="1" required /></div></div><div class="form-grid"><div class="field"><label>קטגוריה</label><select name="category"><option value="home">בית וחשבונות</option><option value="groceries">אוכל וקניות</option><option value="fuel">דלק</option><option value="transport">תחבורה</option><option value="health">בריאות</option><option value="leisure">בילויים ואישי</option><option value="other">אחר</option></select></div><div class="field"><label>אמצעי תשלום</label><select name="method"><option value="debit">דיירקט / בנק</option><option value="credit">אשראי</option><option value="cash">מזומן</option></select></div></div><p class="hint">התשלום יופיע כהתחייבות במחזור, וייכנס להוצאות רק כשתסמן אותו כשולם.</p><button class="save" type="submit">הוספת הוצאה קבועה</button></form></dialog>
