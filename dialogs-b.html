<dialog id="credit-payment-dialog"><form class="form" id="credit-payment-form"><div class="formhead"><h2>עדכון חשבון אשראי</h2><button class="close" type="button" data-close aria-label="סגירה">×</button></div><div class="field"><label for="credit-status">מצב החשבון</label><select id="credit-status" name="status"><option value="paid">כבר ירד בבנק</option><option value="pending">חיוב עתידי — עדכון הסכום בלבד</option></select></div><div class="form-grid"><div class="field"><label>סכום החשבון הכולל</label><input name="amount" type="number" min="0.01" step="0.01" required /></div><div class="field"><label>מתי ירד בבנק?</label><input name="paidDate" type="date" required /></div></div><p class="hint">הקניות שכבר נרשמו באשראי לא ייספרו שוב בתקציב.</p><button class="save" type="submit">שמירת החשבון</button></form></dialog>
<dialog id="settings-dialog"><form class="form" id="settings-form"><div class="formhead"><h2>הגדרות תקציב</h2><button class="close" type="button" data-close aria-label="סגירה">×</button></div><div class="form-grid"><div class="field"><label>יום המשכורת</label><input name="paydayDay" type="number" min="1" max="28" required /></div><div class="field"><label>יום סגירת האשראי</label><input name="creditClosingDay" type="number" min="1" max="28" required /></div><div class="field"><label>יום חיוב האשראי</label><input name="creditPaymentDay" type="number" min="1" max="28" required /></div></div><button class="save" type="submit">שמירת ההגדרות</button></form></dialog>
