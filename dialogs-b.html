<dialog id="credit-payment-dialog"><form class="form" id="credit-payment-form"><div class="formhead"><h2>עדכון חשבון אשראי</h2><button class="close" type="button" data-close aria-label="סגירה">×</button></div><div class="field"><label for="credit-status">מצב החשבון</label><select id="credit-status" name="status"><option value="paid">כבר ירד בבנק</option><option value="pending">חיוב עתידי — עדכון הסכום בלבד</option></select></div><div class="form-grid"><div class="field"><label>סכום החשבון הכולל<input name="amount" type="number" min="0.01" step="0.01" required /></label></div><div class="field"><label>מתי ירד בבנק?<input name="paidDate" type="date" required /></label></div></div><p class="hint">הקניות שכבר נרשמו באשראי לא ייספרו שוב בתקציב.</p><button class="save" type="submit">שמירת החשבון</button></form></dialog>
<dialog id="settings-dialog"><form class="form" id="settings-form"><div class="formhead"><h2>הגדרות תקציב</h2><button class="close" type="button" data-close aria-label="סגירה">×</button></div><div class="form-grid"><div class="field"><label>יום המשכורת<input name="paydayDay" type="number" min="1" max="28" required /></label></div><div class="field"><label>יום סגירת האשראי<input name="creditClosingDay" type="number" min="1" max="28" required /></label></div><div class="field"><label>יום חיוב האשראי<input name="creditPaymentDay" type="number" min="1" max="28" required /></label></div></div><button class="save" type="submit">שמירת ההגדרות</button></form></dialog>
<dialog id="card-dialog"><form class="form" id="card-form" autocomplete="off"><div class="formhead"><h2>משיכת אשראי</h2><button class="close" type="button" data-close aria-label="סגירה">×</button></div><p class="hint">הסיסמה נשמרת מוצפנת בשרת. היא לא מוצגת שוב ולא נשלחת לטלגרם. המשיכה רצה כל בוקר, ואפשר גם לבקש אותה מכאן.</p><div class="field"><label for="card-company">חברת האשראי</label><select id="card-company" name="company" required><option value="max">מקס</option><option value="visaCal">כאל</option><option value="isracard">ישראכרט</option><option value="amex">אמקס</option></select></div><div class="form-grid"><div class="field"><label>תעודת זהות<input name="idNumber" inputmode="numeric" autocomplete="off" required /></label></div><div class="field" id="card-digits-field" hidden><label>6 ספרות אחרונות<input name="card6Digits" inputmode="numeric" autocomplete="off" pattern="\d{6}" /></label></div></div><div class="field"><label>סיסמה<input name="password" type="password" autocomplete="new-password" minlength="4" required /></label></div><p class="hint" id="card-status"></p><button class="save" type="submit">שמירת הסיסמה</button><button class="small-button" id="card-pull" type="button">משוך עכשיו</button><button class="small-button" id="card-forget" type="button">מחק סיסמה</button></form></dialog>
