[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/budget"
  to = "/.netlify/functions/budget"
  status = 200

[[redirects]]
  from = "/api/telegram"
  to = "/.netlify/functions/telegram"
  status = 200

[[redirects]]
  from = "/api/telegram/setup"
  to = "/.netlify/functions/telegram-setup"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
