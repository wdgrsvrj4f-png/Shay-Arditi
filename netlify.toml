[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PUPPETEER_SKIP_DOWNLOAD = "1"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "1"

[functions."card-sync-background"]
  external_node_modules = ["@sparticuz/chromium", "israeli-bank-scrapers", "puppeteer", "puppeteer-core"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[functions."card-schedule"]
  schedule = "0 3 * * *"

[[redirects]]
  from = "/api/budget"
  to = "/.netlify/functions/budget"
  status = 200

[[redirects]]
  from = "/api/telegram"
  to = "/.netlify/functions/telegram"
  status = 200

[[redirects]]
  from = "/api/telegram/setup"
  to = "/.netlify/functions/telegram-setup"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/card"
  to = "/.netlify/functions/card"
  status = 200

[[redirects]]
  from = "/api/card/sync"
  to = "/.netlify/functions/card"
  status = 200

[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
